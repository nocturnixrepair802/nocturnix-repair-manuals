name: Deploy Nocturnix Repair Manuals

on:
  push:
    branches:
      - development/manual-library-v0.3
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pull request checks must not cancel a deployment from the development branch.
  group: github-pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint
        working-directory: apps/web
        run: npm run lint

      - name: Test library and migrations
        working-directory: apps/web
        run: npm test

      - name: Build PWA for GitHub Pages
        working-directory: apps/web
        env:
          VITE_BASE_PATH: /nocturnix-repair-manuals/
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/development/manual-library-v0.3'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    # Validate pull requests without publishing their code or requiring Pages setup.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/development/manual-library-v0.3'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Check GitHub Pages configuration
        uses: actions/configure-pages@v6
        with:
          # Enable Pages once in repository Settings, with Source = GitHub Actions.
          enablement: false

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
